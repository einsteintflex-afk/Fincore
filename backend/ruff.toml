line-length = 120
target-version = "py312"
exclude = ["alembic/versions"]

[lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S105", "S106", "B008", "B904", "S311", "UP017", "UP038", "E501"]

[lint.per-file-ignores]
"tests/*" = ["S", "E501", "B"]
"app/services/backups.py" = ["S603", "S607"]  # fixed PostgreSQL client tools; db names validated
"app/models/guards.py" = ["S608"]            # DDL built from constants only
