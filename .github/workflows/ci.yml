name: CI
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: fincore, POSTGRES_PASSWORD: fincore, POSTGRES_DB: fincore_test }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: python -m pytest
        env:
          FINCORE_DATABASE_URL: postgresql+psycopg://fincore:fincore@localhost:5432/fincore_test
      - name: Migrations apply to an empty database and match the models
        env:
          PGPASSWORD: fincore
          FINCORE_DATABASE_URL: postgresql+psycopg://fincore:fincore@localhost:5432/fincore_migrate
        run: |
          psql -h localhost -U fincore -d fincore_test -c "CREATE DATABASE fincore_migrate"
          alembic upgrade head
          alembic check

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build
      - run: npm test
